<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中西医结合 - 智慧中西医平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:#e3f0ea;padding:24px;}
        .container{max-width:900px;margin:0 auto;background:#fff;border-radius:40px;padding:32px;box-shadow:0 12px 28px rgba(0,0,0,0.08);}
        h1{color:#2d6a4f;border-left:6px solid #2b7a4b;padding-left:18px;margin-bottom:20px;}
        .back-btn{display:inline-block;margin-bottom:24px;color:#2d6a4f;text-decoration:none;font-weight:600;}
        .card{background:#f4faf5;border-radius:28px;padding:20px;margin:20px 0;border:1px solid #cde6d8;}
        .badge{background:#dff0e6;display:inline-block;padding:6px 14px;border-radius:30px;margin-bottom:16px;}
        ul{margin-left:20px;color:#2c5a42;line-height:1.6;}
        li{margin:10px 0;}
        .highlight{background:#eef1e6;border-radius:24px;padding:16px;margin-top:20px;}
        .footer{margin-top:36px;text-align:center;color:#6d8b7a;}
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回首页</a >
    <h1><i class="fas fa-hand-holding-heart"></i> 中西医结合特色诊疗</h1>
    <div class="card">
        <div class="badge">优势病种 · 整合医学</div>
        <p>基于“辨证与辨病结合”模式，重点开展：</p >
        <ul>
            <li>🎗️ 肿瘤康复期中西医协同治疗（放化疗减毒、免疫调理）</li>
            <li>🩸 糖尿病逆转综合方案（中药+膳食+动态血糖监测）</li>
            <li>🧠 慢性疼痛管理（针灸+康复+西药阶梯镇痛）</li>
            <li>❤️ 冠心病/心衰中西医结合心脏康复</li>
        </ul>
    </div>
    <div class="highlight">
        <i class="fas fa-quote-left"></i> 临床研究证实：中西医结合治疗消化道肿瘤术后生活质量提升32%
    </div>
    <div class="card">
        <h3>👥 适用人群推荐</h3>
        <ul><li>慢性病、术后康复、亚健康及疑难杂症患者</li><li>寻求减停西药、减少副作用人群</li></ul>
    </div>
    <div class="footer">© 人民当家作组</div>
</div>
