<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗服务专区 - 智慧中西医平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:#eaf2ef;padding:24px;}
        .container{max-width:900px;margin:0 auto;background:#fff;border-radius:40px;padding:32px;box-shadow:0 12px 28px rgba(0,0,0,0.08);}
        h1{color:#1e4a34;border-left:6px solid #2b7a4b;padding-left:18px;margin-bottom:20px;}
        .back-btn{display:inline-block;margin-bottom:24px;color:#2b7a4b;text-decoration:none;font-weight:600;}
        .back-btn i{margin-right:6px;}
        .card{background:#f9fbf7;border-radius:28px;padding:20px;margin:20px 0;border:1px solid #ddebe0;}
        .badge{background:#e6f2ec;display:inline-block;padding:6px 14px;border-radius:30px;font-size:0.8rem;margin-bottom:16px;}
        .service-item{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #e0ecd9;}
        .service-item i{font-size:2rem;color:#40916c;width:50px;text-align:center;}
        .service-item h3{color:#2c5a42;margin-bottom:6px;}
        .service-item p{color:#6d8b7a;font-size:0.85rem;}
        .footer{margin-top:36px;text-align:center;color:#6d8b7a;font-size:0.8rem;padding-top:20px;border-top:1px solid #ddebe0;}
    </style>
</head>
<body>
<div class="container">
    <a href="1.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回首页</a >
    <h1><i class="fas fa-hospital-user"></i> 医疗服务专区</h1>
    
    <div class="card">
        <div class="badge">一站式 · 全周期健康管理</div>
        <div class="service-item">
            <i class="fas fa-map-marker-alt"></i>
            <div><h3><a href="智能导诊.html">智慧导诊</a></h3><p>根据症状智能推荐科室，预约挂号一键直达</p ></div>
        </div>
        <div class="service-item">
            <i class="fas fa-comment-medical"></i>
            <div><h3><a href="西医在线问诊.html">西区在线问诊</a></h3><p>三甲医院专家线上图文/视频问诊，药品配送到家</p ></div>
        </div>
        <div class="service-item">
            <i class="fas fa-hands-helping"></i>
            <div><h3><a href="护理服务上.html">护理服务</a></h3><p>上门护理（压疮护理、PICC维护）、安宁疗护、居家康复指导</p ></div>
        </div>
        <div class="service-item">
            <i class="fas fa-ambulance"></i>
            <div><h3><a href="绿色通道服务.html">绿色通道服务</a></h3><p>急危重症转诊、多学科会诊(MDT)快速预约</p ></div>
        </div>
        <div class="service-item">
            <i class="fas fa-phone-alt"></i>
            <div><h3><a href="健康管家专线.html">健康管家专线</a></h3><p>7×24小时一对一健康咨询与用药提醒</p ></div>
        </div>
    </div>
    
    
    
    <div class="footer">© 人民当家作组</div>
</div>
</body>
</html>
