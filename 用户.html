<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 智慧中西医</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', 'PingFang SC', sans-serif; }
        body {
            background: linear-gradient(135deg, #e1f0e8 0%, #cbe6d9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .login-container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 48px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1e4a34, #2b7a4b);
            padding: 32px 24px;
            text-align: center;
            color: white;
        }
        .login-header i {
            font-size: 3rem;
            color: #ffd966;
            margin-bottom: 12px;
        }
        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }
        .login-header p {
            opacity: 0.8;
            margin-top: 8px;
        }
        .login-body {
            padding: 32px 28px;
        }
        .tab-buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            border-bottom: 2px solid #e2efdf;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #8ba88e;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: #2b7a4b;
            border-bottom: 3px solid #2b7a4b;
            margin-bottom: -2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c5a42;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddebe0;
            border-radius: 60px;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2b7a4b;
            box-shadow: 0 0 0 3px rgba(43, 122, 75, 0.1);
        }
        .login-btn {
            width: 100%;
            background: #2b7a4b;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
        }
        .login-btn:hover {
            background: #1e5a3a;
        }
        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        .back-link a {
            color: #6d8b7a;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link a:hover {
            color: #2b7a4b;
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 6px;
            display: none;
        }
        .form-panel {
            display: none;
        }
        .form-panel.active {
            display: block;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <i class="fas fa-leaf"></i>
        <h1>智能中西医</h1>
        <p>智慧医疗 · 健康相伴</p >
    </div>
    <div class="login-body">
		<!--标签页切换按钮-->
        <div class="tab-buttons">
            <button class="tab-btn active" id="loginTabBtn">登录</button>
            <button class="tab-btn" id="registerTabBtn">注册</button>
        </div>
        
        <!-- 登录表单 -->
        <div id="loginPanel" class="form-panel active">
            <div class="form-group">
                <label>用户名 / 手机号</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <div id="loginError" class="error-msg">用户名或密码错误</div>
            <button class="login-btn" id="doLoginBtn"><i class="fas fa-sign-in-alt"></i> 登录</button>
            <div class="back-link"><a href="1.html"><i class="fas fa-arrow-left"></i> 返回首页</a ></div>
        </div>
        
        <!-- 注册表单 -->
        <div id="registerPanel" class="form-panel">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="请设置用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请设置密码">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regConfirmPwd" placeholder="请再次输入密码">
            </div>
            <div id="regError" class="error-msg">两次密码不一致或用户名已存在</div>
            <button class="login-btn" id="doRegisterBtn"><i class="fas fa-user-plus"></i> 注册</button>
            <div class="back-link"><a href="index.html"><i class="fas fa-arrow-left"></i> 返回首页</a ></div>
        </div>
    </div>
</div>

<script>
    // 切换登录/注册面板
    const loginTab = document.getElementById('loginTabBtn');
    const registerTab = document.getElementById('registerTabBtn');
    const loginPanel = document.getElementById('loginPanel');
    const registerPanel = document.getElementById('registerPanel');
    
    loginTab.addEventListener('click', () => {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginPanel.classList.add('active');
        registerPanel.classList.remove('active');
    });
    
    registerTab.addEventListener('click', () => {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerPanel.classList.add('active');
        loginPanel.classList.remove('active');
    });
    
    // 获取存储的用户列表
    function getUsers() {
        const users = localStorage.getItem('users');
        return users ? JSON.parse(users) : [];
    }
    
    function saveUsers(users) {
        localStorage.setItem('users', JSON.stringify(users));
    }
    
    // 注册
    const doRegisterBtn = document.getElementById('doRegisterBtn');
    const regError = document.getElementById('regError');
    
    doRegisterBtn.addEventListener('click', () => {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirmPwd = document.getElementById('regConfirmPwd').value;
        
        if (!username || !password) {
            regError.innerText = '用户名和密码不能为空';
            regError.style.display = 'block';
            return;
        }
        if (password !== confirmPwd) {
            regError.innerText = '两次输入的密码不一致';
            regError.style.display = 'block';
            return;
        }
        
        const users = getUsers();
        if (users.find(u => u.username === username)) {
            regError.innerText = '用户名已存在';
            regError.style.display = 'block';
            return;
        }
        
        users.push({ username, password });
        saveUsers(users);
        
        // 注册成功后自动登录
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userName', username);
        
        // 跳转回首页
        window.location.href = '1.html';
    });
    
    // 登录
    const doLoginBtn = document.getElementById('doLoginBtn');
    const loginError = document.getElementById('loginError');
    
    doLoginBtn.addEventListener('click', () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        
        const users = getUsers();
        const user = users.find(u => u.username === username && u.password === password);
        
        // 如果没有注册过，默认允许登录
        if (user || (username && password)) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userName', username || '访客用户');
            
            // 如果用户不存在但输入了信息，自动注册
            if (!user && username && password) {
                users.push({ username, password });
                saveUsers(users);
            }
            
            window.location.href = '1.html';
        } else {
            loginError.style.display = 'block';
        }
    });
    
    // 如果已经登录，直接跳转回首页
    if (localStorage.getItem('isLoggedIn') === 'true') {
        // 可选：直接跳回首页
        
    }
</script>
</body>
</html>
